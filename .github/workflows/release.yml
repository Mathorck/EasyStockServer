name: Release

# Tags are plain SemVer without a "v": X.Y.Z, or X.Y.Z-rc.1 for a pre-release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/mathorck/easystock-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # The drift tests compare the server with the app's schema.dbml and Permissions.kt.
      # Private app repository: add a read-only token as the APP_REPO_TOKEN secret.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: Mathorck/EasyStock
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            server/**/*.csproj
            server/**/packages.lock.json
            server/Directory.Packages.props

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        env:
          EASYSTOCK_APP_DIR: ${{ github.workspace }}/app
        run: dotnet test --no-build -c Release

  binaries:
    name: Binary ${{ matrix.rid }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Self-contained single file: no .NET runtime needed on the host.
      # appsettings.json stays next to the binary (Serilog levels), it is not embedded.
      - name: Publish
        working-directory: server
        run: >
          dotnet publish src/EasyStock.Server -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ github.ref_name }} -p:OpenApiGenerateDocuments=false
          -o "$RUNNER_TEMP/publish"

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: |
          NAME="EasyStock.Server-$GITHUB_REF_NAME-$RID"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE" dist
          if [[ "$RID" == win-* ]]; then BIN=EasyStock.Server.exe; else BIN=EasyStock.Server; fi
          cp "$RUNNER_TEMP/publish/$BIN" "$RUNNER_TEMP/publish/appsettings.json" LICENSE "$STAGE/"
          if [[ "$RID" == win-* ]]; then
            (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/$NAME.zip" "$NAME")
            ARCHIVE="$NAME.zip"
          else
            tar -C "$RUNNER_TEMP" -czf "dist/$NAME.tar.gz" "$NAME"
            ARCHIVE="$NAME.tar.gz"
          fi
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z gets X.Y.Z, X.Y, X and latest. A pre-release only gets its own tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the Docker section
        run: |
          {
            echo
            echo "### Docker"
            echo
            echo '```'
            echo "docker pull $GHCR_IMAGE:$GITHUB_REF_NAME"
            echo '```'
          } >> RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          name: EasyStock Server ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
