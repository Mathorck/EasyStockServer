name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mathorck/easystock-server

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Notice when the server project is missing
        if: hashFiles('server/**/*.csproj') == ''
        working-directory: .
        run: echo "::notice::No server project found under server/, skipping tests."

      - uses: actions/setup-dotnet@v4
        if: hashFiles('server/**/*.csproj') != ''
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            server/**/*.csproj
            server/**/packages.lock.json
            server/Directory.Packages.props

      - name: Restore
        if: hashFiles('server/**/*.csproj') != ''
        run: dotnet restore

      - name: Build
        if: hashFiles('server/**/*.csproj') != ''
        run: dotnet build --no-restore -c Release

      - name: Test
        if: hashFiles('server/**/*.csproj') != ''
        run: dotnet test --no-build -c Release

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notice when the Dockerfile is missing
        if: hashFiles('server/Dockerfile') == ''
        run: echo "::notice::No server/Dockerfile found, skipping image build."

      - uses: docker/setup-qemu-action@v3
        if: hashFiles('server/Dockerfile') != ''

      - uses: docker/setup-buildx-action@v3
        if: hashFiles('server/Dockerfile') != ''

      - uses: docker/login-action@v3
        if: hashFiles('server/Dockerfile') != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: hashFiles('server/Dockerfile') != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: hashFiles('server/Dockerfile') != ''
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
