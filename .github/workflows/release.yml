name: Release

# Tags are plain SemVer without a "v": X.Y.Z, or X.Y.Z-rc.1 for a pre-release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/mathorck/easystock-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The drift tests compare the server with the app's schema.dbml and Permissions.kt.
      # Private app repository: add a read-only token as the APP_REPO_TOKEN secret.
      - name: Check out the app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Mathorck/EasyStock
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            server/**/*.csproj
            server/**/packages.lock.json
            server/Directory.Packages.props

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        env:
          EASYSTOCK_APP_DIR: ${{ github.workspace }}/app
        run: dotnet test --no-build -c Release

  # The app's client and sync code against the Docker image (docs/05-e2e-tests.md), same as in ci.yml.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out the app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Mathorck/EasyStock
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: End-to-end tests
        run: server/e2e/run.sh app

  binaries:
    name: Binary ${{ matrix.rid }}
    needs: [test, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Self-contained single file: no .NET runtime needed on the host.
      # appsettings.json stays next to the binary (Serilog levels), it is not embedded.
      - name: Publish
        working-directory: server
        env:
          REF_NAME: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: >
          dotnet publish src/EasyStock.Server -c Release -r "$RID"
          --self-contained -p:PublishSingleFile=true -p:DebugType=none
          -p:Version="$REF_NAME" -p:OpenApiGenerateDocuments=false
          -o "$RUNNER_TEMP/publish"

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: |
          NAME="EasyStock.Server-$GITHUB_REF_NAME-$RID"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE" dist
          if [[ "$RID" == win-* ]]; then BIN=EasyStock.Server.exe; else BIN=EasyStock.Server; fi
          cp "$RUNNER_TEMP/publish/$BIN" "$RUNNER_TEMP/publish/appsettings.json" LICENSE "$STAGE/"
          if [[ "$RID" == win-* ]]; then
            (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/$NAME.zip" "$NAME")
            ARCHIVE="$NAME.zip"
          else
            tar -C "$RUNNER_TEMP" -czf "dist/$NAME.tar.gz" "$NAME"
            ARCHIVE="$NAME.tar.gz"
          fi
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z gets X.Y.Z, X.Y, X and latest. A pre-release only gets its own tag.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the Docker section
        run: |
          {
            echo
            echo "### Docker"
            echo
            echo '```'
            echo "docker pull $GHCR_IMAGE:$GITHUB_REF_NAME"
            echo '```'
          } >> RELEASE_NOTES.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: EasyStock Server ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
