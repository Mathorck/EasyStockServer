name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # The drift tests compare the server with the app's schema.dbml and Permissions.kt.
      # Private app repository: add a read-only token as the APP_REPO_TOKEN secret.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: Mathorck/EasyStock
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Notice when the server project is missing
        if: hashFiles('server/**/*.csproj') == ''
        working-directory: .
        run: echo "::notice::No server project found under server/, skipping build and test."

      - uses: actions/setup-dotnet@v4
        if: hashFiles('server/**/*.csproj') != ''
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            server/**/*.csproj
            server/**/packages.lock.json
            server/Directory.Packages.props

      - name: Restore
        if: hashFiles('server/**/*.csproj') != ''
        run: dotnet restore

      - name: Build
        if: hashFiles('server/**/*.csproj') != ''
        run: dotnet build --no-restore -c Release

      - name: Test
        if: hashFiles('server/**/*.csproj') != ''
        env:
          EASYSTOCK_APP_DIR: ${{ github.workspace }}/app
        run: dotnet test --no-build -c Release --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always() && hashFiles('server/**/*.csproj') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: server/TestResults
          if-no-files-found: ignore

  # The app's client and sync code against the Docker image (docs/05-e2e-tests.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: Mathorck/EasyStock
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      # The runner image has the Android SDK (ANDROID_HOME); Gradle installs a missing platform itself.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: End-to-end tests
        run: server/e2e/run.sh app

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            app/shared/build/reports/tests/testAndroidHostTest
            app/shared/build/test-results/testAndroidHostTest
            server/e2e/.run/server.log
          if-no-files-found: ignore
